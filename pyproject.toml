[project]
name = "frame"
version = "0.2.0"
description = ""
authors = [
    {name = "Moritz Enderle",email = "contact@moritzenderle.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pillow (>=10.0.0,<13.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "zeroconf (>=0.130.0)",
]

[project.optional-dependencies]
led = ["gpiozero (>=2.0)", "lgpio (>=0.2.2.0)"]

[dependency-groups]
dev = [
    "isort (>=7.0.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
